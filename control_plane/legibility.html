<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Project Map</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        ul {
            list-style-type: none;
            padding-left: 16px;
            margin: 2px 0;
        }

        li {
            line-height: 1.4em;
        }

        .folder {
            font-weight: bold;
            cursor: pointer;
        }

        .file {
            color: #333;
        }

        .region {
            color: #777;
            font-size: 0.9em;
        }

        .hidden {
            display: none;
        }

        .tokens {
            color: #999;
            font-size: 0.85em;
            margin-left: 6px;
        }

    </style>
</head>

<body>


<div id="tree"></div>

<script>

    async function loadProject() {
        const res = await fetch("/project")
        const data = await res.json()

        const root = document.getElementById("tree")
        root.appendChild(renderNode(data))
    }

    function renderNode(node) {
        const li = document.createElement("li")

        const label = document.createElement("span")

        let prefix = ""

        if (node.tokens) {
            prefix = `(${node.tokens}) `
        }

        if (node.type === "directory") {
            label.textContent = `${prefix}📁 ${node.name}`
            label.className = "folder"
        } else {
            label.textContent = `${prefix}📄 ${node.name}`
            label.className = "file"
        }

       

        li.appendChild(label)

        // children
        if (node.children && node.children.length > 0) {
            const ul = document.createElement("ul")

            // folders first, then files
            node.children.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name)
                return a.type === "directory" ? -1 : 1
            })

            node.children.forEach(child => {
                ul.appendChild(renderNode(child))
            })

            label.onclick = () => {
                ul.classList.toggle("hidden")
            }

            li.appendChild(ul)
        }

        // regions (unchanged, just slightly cleaner)
        if (node.regions && node.regions.length > 0) {
            const ul = document.createElement("ul")

            node.regions.forEach(r => {
                const region = document.createElement("li")
                region.className = "region"
                region.textContent = `🔹 ${r.name} (${r.tokens})`
                ul.appendChild(region)
            })

            li.appendChild(ul)
        }

        return li
    }

    function expandAll() {
        document.querySelectorAll("ul").forEach(ul => {
            ul.classList.remove("hidden")
        })
    }

    function collapseAll() {
        document.querySelectorAll("#tree > ul > li > ul").forEach(ul => {
            ul.classList.add("hidden")
        })
    }

    loadProject()

</script>

</body>
</html>
