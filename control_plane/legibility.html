<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Project Map</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        ul {
            list-style-type: none;
            padding-left: 16px;
            margin: 2px 0;
        }

        li {
            line-height: 1.4em;
        }

        .folder {
            font-weight: bold;
            cursor: pointer;
        }

        .file {
            color: #333;
        }

        .region {
            color: #777;
            font-size: 0.9em;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .tokens {
            color: #999;
            font-size: 0.85em;
            margin-left: 6px;
        }

        .documentation {
            font-size: 0.85em;
            color: #555;
            padding-left: 12px;
            margin: 2px 0 4px 0;
            border-left: 2px solid #ccc;
        }

    </style>
</head>

<body>



<div id="tree"></div>

<script>

    async function loadProject() {
        const res = await fetch("/project")
        const data = await res.json()

        const root = document.getElementById("tree")
        root.appendChild(renderNode(data))
    }

    function humanReadableNumber(num) {
        if (num < 1000) {
            return num.toString();
        } else if (num < 1_000_000) {
            return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        } else if (num < 1_000_000_000) {
            return (num / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
        } else {
            return (num / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'B';
        }
    }

    function renderNode(node) {
        const li = document.createElement("li")

        const label = document.createElement("span")

        let prefix = ""
        if (node.tokens) {
            prefix = `(${humanReadableNumber(node.tokens)}) `
        }

        if (node.type === "directory") {
            label.textContent = `📁 ${node.name} ${prefix}`
            label.className = "folder"
        } else {
            label.textContent = `📄 ${node.name} ${prefix}`
            label.className = "file"
        }

        li.appendChild(label)

        // children
        if (node.children && node.children.length > 0) {
            const ul = document.createElement("ul")

            // folders first, then files
            node.children.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name)
                return a.type === "directory" ? -1 : 1
            })

            node.children.forEach(child => {
                ul.appendChild(renderNode(child))
            })

            label.onclick = () => {
                ul.classList.toggle("hidden")
            }

            li.appendChild(ul)
        }

        // regions with collapsible documentation
        if (node.regions && node.regions.length > 0) {
            const ul = document.createElement("ul")

            node.regions.forEach(r => {
                const region = document.createElement("li")
                region.className = "region"
                region.textContent = `🔹 ${r.name} (${r.tokens})`

                ul.appendChild(region)

                // add documentation if available
                if (r.documentation) {
                    const doc = document.createElement("div")
                    doc.className = "documentation hidden"
                    doc.textContent = r.documentation
                    region.appendChild(doc)

                    // toggle doc visibility on click
                    region.onclick = (e) => {
                        e.stopPropagation() // prevent collapsing folder
                        doc.classList.toggle("hidden")
                    }
                }
            })

            li.appendChild(ul)
        }

        return li
    }

    function expandAll() {
        document.querySelectorAll("ul").forEach(ul => {
            ul.classList.remove("hidden")
        })
    }

    function collapseAll() {
        document.querySelectorAll("#tree > ul > li > ul").forEach(ul => {
            ul.classList.add("hidden")
        })
    }

    loadProject()

</script>

</body>
</html>
