<!DOCTYPE html>
<html>
<head>
    <!-- region head -->
    <!--
    Contains metadata, page title, and CSS styles for layout and tree rendering.
    -->
    <meta charset="UTF-8">
    <title>Project Map</title>

    <style>
        /* region styles */
        /*
        Styles define layout: left tree pane, right content pane,
        typography, folder/file appearance, collapsible regions, and controls.
        */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
        }

        #tree-pane {
            width: 20%;
            min-width: 200px;
            max-width: 300px;
            border-right: 1px solid #ccc;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
            word-wrap: break-word;
        }

        #content-pane {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        ul {
            list-style-type: none;
            padding-left: 16px;
            margin: 2px 0;
        }

        li {
            line-height: 1.4em;
            word-wrap: break-word;
        }

        .folder {
            font-weight: bold;
            cursor: pointer;
        }

        .file {
            color: #333;
        }

        .region {
            color: #777;
            font-size: 0.9em;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .tokens {
            color: #999;
            font-size: 0.85em;
            margin-left: 6px;
        }

        .documentation {
            font-size: 0.85em;
            color: #555;
            padding-left: 12px;
            margin: 2px 0 4px 0;
            border-left: 2px solid #ccc;
            word-wrap: break-word;
        }

        .controls {
            margin-bottom: 12px;
        }

        .controls button {
            margin-right: 8px;
            padding: 4px 10px;
            font-size: 0.9em;
            cursor: pointer;
        }
        /* endregion styles */
    </style>
    <!-- endregion head -->
</head>

<body>
<!-- region left_pane -->
<!--
Left pane contains folder tree and control buttons for expanding/collapsing folders.
-->
<div id="tree-pane">
    <div class="controls">
        <button onclick="expandAllFolders()">📂 🡫</button>
        <button onclick="collapseAllFolders()">📁🡩</button>
    </div>
    <div id="tree"></div>
</div>
<!-- endregion left_pane -->

<!-- region right_pane -->
<!--
Right pane reserved for optional content display.
-->
<div id="content-pane">
    <!-- Optional content here -->
</div>
<!-- endregion right_pane -->

<!-- region scripts -->
<!--
Contains JavaScript for fetching project data, rendering tree, formatting numbers,
handling collapsible folders, regions, and documentation.
-->
<script>
    async function loadProject() {
        const res = await fetch("/project")
        const data = await res.json()

        const root = document.getElementById("tree")
        root.appendChild(renderNode(data))
    }

    // region helpers
    /*
    Helper functions: humanReadableNumber converts tokens to K/M/B format.
    */
    function humanReadableNumber(num) {
        if (num < 1000) {
            return num.toString();
        } else if (num < 1_000_000) {
            return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        } else if (num < 1_000_000_000) {
            return (num / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
        } else {
            return (num / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'B';
        }
    }
    // endregion helpers

    // region render_node
    /*
    Renders a tree node recursively, handling folders, files, and regions with documentation.
    */
    function renderNode(node) {
        const li = document.createElement("li")
        const label = document.createElement("span")
        let prefix = ""
        if (node.tokens) {
            prefix = `(${humanReadableNumber(node.tokens)}) `
        }

        if (node.type === "directory") {
            label.textContent = `📁 ${node.name} ${prefix}`
            label.className = "folder"
        } else {
            label.textContent = `📄 ${node.name} ${prefix}`
            label.className = "file"
        }

        li.appendChild(label)

        if (node.children && node.children.length > 0) {
            const ul = document.createElement("ul")
            node.children.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name)
                return a.type === "directory" ? -1 : 1
            })
            node.children.forEach(child => ul.appendChild(renderNode(child)))
            label.onclick = () => { ul.classList.toggle("hidden") }
            li.appendChild(ul)
        }

        if (node.regions && node.regions.length > 0) {
            const ul = document.createElement("ul")
            node.regions.forEach(r => {
                const region = document.createElement("li")
                region.className = "region"
                region.textContent = `🔹 ${r.name} (${r.tokens})`
                ul.appendChild(region)

                if (r.documentation) {
                    const doc = document.createElement("div")
                    doc.className = "documentation hidden"
                    doc.textContent = r.documentation
                    region.appendChild(doc)
                    region.onclick = (e) => {
                        e.stopPropagation()
                        doc.classList.toggle("hidden")
                    }
                }
            })
            li.appendChild(ul)
        }

        return li
    }
    // endregion render_node

    // region controls
    /*
    Functions to expand/collapse all folders and documentation at once.
    */
    function expandAllFolders() {
        document.querySelectorAll("#tree .folder").forEach(folder => {
            const ul = folder.nextElementSibling
            if (ul && ul.tagName === "UL") ul.classList.remove("hidden")
        })
        expandAllDocs()
    }

    function collapseAllFolders() {
        document.querySelectorAll("#tree .folder").forEach(folder => {
            const ul = folder.nextElementSibling
            if (ul && ul.tagName === "UL") ul.classList.add("hidden")
        })
        collapseAllDocs()
    }

    function expandAllDocs() {
        document.querySelectorAll(".documentation").forEach(d => d.classList.remove("hidden"))
    }

    function collapseAllDocs() {
        document.querySelectorAll(".documentation").forEach(d => d.classList.add("hidden"))
    }
    // endregion controls

    loadProject()
</script>
<!-- endregion scripts -->
</body>
</html>
